name: Deploy Playground to Pages

# Builds the SVM backend — the playground's sole engine. The legacy bytecode VM
# was removed in item 6 (SVM is the only backend). The playground runs edited
# source entirely client-side: jacl_emit.wasm (the LLVM-free frontend → SVM IR) →
# svm_link_run in svm_browser.wasm (generic link vs jaclrt.svm + run), and runs
# unedited examples from precompiled .svmb blobs. See demo/svm/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # vendor/svm — the cdylib + svm-llvm for the SVM backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Setup Rust (wasm32 for the svm-browser cdylib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang/LLVM 18 (svm-llvm bakes jaclrt.svm)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # Produces the SVM backend assets: svm_browser.wasm + jacl_emit.{js,wasm} + jaclrt.svm
      # (+ a couple precompiled example .svmb). Reuses the same script the docs describe.
      - name: Build SVM assets
        run: bash demo/svm/build_assets.sh

      # Bundles the CodeMirror editor via esbuild (npm ci on first run) and
      # regenerates examples.json from test/jacl/*.jacl. Produces
      # demo/dist/playground.js. (WASM assets come from build_assets.sh above.)
      - name: Build demo assets
        run: bash build_demo.sh
        working-directory: demo

      # Assemble a self-contained site directory with real files.
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/wasm _site/dist _site/svm/svmb
          cp demo/index.html      _site/index.html
          cp demo/examples.json   _site/examples.json
          cp demo/dist/playground.js _site/dist/playground.js
          # SVM backend: cdylib + in-browser frontend + runtime blob + precompiled examples
          cp demo/wasm/svm_browser.wasm _site/wasm/svm_browser.wasm
          cp demo/wasm/jacl_emit.js     _site/wasm/jacl_emit.js
          cp demo/wasm/jacl_emit.wasm   _site/wasm/jacl_emit.wasm
          cp demo/svm/jaclrt.svm        _site/svm/jaclrt.svm
          cp -r demo/svm/svmb/.         _site/svm/svmb/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
