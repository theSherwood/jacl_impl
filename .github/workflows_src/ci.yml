name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libffi-dev pkg-config

      - name: Build and run tests
        # build.sh compiles every test then runs it, exiting non-zero on
        # any failure. --parallel uses all cores. The outer `timeout`
        # guards against the chaos suite livelocking on rare seeds
        # (see AGENTS.md); a timeout surfaces as a CI failure, which is
        # what we want.
        run: timeout 900 ./build.sh --parallel

      - name: Staged-syntax codec agreement
        # syn_wire (compiler side) and syn_rt (runtime side) are two hand-written
        # implementations of one byte format, in separate files, that must agree exactly.
        # Nothing in CI checked that until now — the format was changed for jacl #113 and the
        # only thing that caught a mistake was running this script by hand. It needs gcc
        # (already installed above), takes a couple of seconds, and skips cleanly without it.
        run: bash codegen/selfhost/macro_staging/run_rt_codec_test.sh

  harness:
    name: Runtime harness (differential interp vs JIT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # vendor/temen — temen-llvm, temen-interp, temen-jit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runtime/harness
            vendor/temen
            vendor/temen/crates/temen-llvm

      - name: Install clang/LLVM 18 (temen-llvm translates the runtime bitcode)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # This job exists because of jacl #141. The `test` job above runs `./build.sh`, which is
      # the *reference VM*'s unit suite; the Rust harness — which owns the differential
      # interp-vs-JIT check AGENTS.md names as the way the backend is verified — ran in no job
      # at all. Three `mt.rs` tests had been failing with `MemoryFault` on **both** backends,
      # and nothing said so, because nothing ran them. The same shape as #134: coverage that
      # exists but runs somewhere nobody looks.
      #
      # The outer `timeout` matters here in a way it does not for build.sh: the temen
      # interpreter multiplexes every `thread.spawn`ed vCPU onto one OS thread, so a
      # multi-worker scheduler test can livelock rather than fail (which is why `par_gc` and
      # `job_gc` are JIT-only). A hang must surface as a CI failure, not as a 6-hour job.
      - name: Harness tests
        run: ( cd runtime/harness && timeout 1800 cargo test --release )

  playground-run-gate:
    name: Playground run path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # vendor/temen — the cdylib and temen-llvm

      - name: Setup Rust (wasm32 for the temen-browser cdylib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # temen-llvm is its OWN workspace (its own Cargo.lock and target/), so leaving it out
      # meant the LLVM-bindings crate — the slowest thing in the job by far — was never cached
      # and was rebuilt every run. That is what made "Build the self-hosted compiler card"
      # 1m44s when the translation itself is ~2s.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/temen
            vendor/temen/browser
            vendor/temen/crates/temen-llvm

      - name: Install clang/LLVM 18 (temen-llvm bakes the .temen assets)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # This job exists because of jacl #134: the playground's gates only ran in pages.yml,
      # which is push-to-main only, so a PR could not see them. PR #92 broke the run-path gate,
      # merged green, and the deploy then failed 17 times before anyone looked. The run path is
      # the part that broke and the cheap part to cover — it needs no Emscripten, unlike
      # stage_gate.mjs, which still runs post-merge only.
      #
      # The three builds are separate steps on purpose: the first version was one step, and its
      # 2m46s told us nothing about which of the three to attack.

      # The cdylib is built entirely from vendor/temen, a *pinned* submodule — it does not
      # depend on any jacl_impl source, so on a PR that does not bump temen the correct answer
      # is a download, not a build. Keyed on the submodule commit, so bumping temen misses the
      # cache and rebuilds, which is exactly right.
      - name: Resolve the temen pin
        id: pin
        run: echo "sha=$(git -C vendor/temen rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the wasm32 cdylib
        id: cdylib-cache
        uses: actions/cache@v4
        with:
          path: vendor/temen/browser/target/wasm32-unknown-unknown/release/temen_browser.wasm
          key: temen-browser-wasm32-${{ steps.pin.outputs.sha }}

      - name: Build the cdylib (wasm32)
        if: steps.cdylib-cache.outputs.cache-hit != 'true'
        run: ( cd vendor/temen/browser && cargo build --release --lib --target wasm32-unknown-unknown )

      # These two *do* depend on repo sources — the runtime and the compiler are what a PR
      # changes — so they are rebuilt every time and only their cargo deps are cached.
      - name: Bake the runtime IR (jaclrt.temen)
        run: bash runtime/build.sh

      - name: Build the self-hosted compiler card (jacl_compiler.temen)
        run: bash codegen/selfhost/build_compiler_temen.sh

      # Both asset scripts are deliberately fail-soft: they exit 0 when the toolchain is
      # missing, so the Pages build can degrade to precompiled examples. That is wrong for a
      # gate — a skip must not read as a pass — so assert the inputs exist before running it.
      - name: Check the gate's inputs were produced
        run: |
          missing=0
          for f in vendor/temen/browser/target/wasm32-unknown-unknown/release/temen_browser.wasm \
                   runtime/build/jaclrt.temen \
                   codegen/selfhost/build/jacl_compiler.temen; do
            if [ ! -s "$f" ]; then echo "missing or empty: $f" >&2; missing=1; fi
          done
          [ "$missing" = 0 ] || { echo "the asset build skipped something (fail-soft) — not a pass" >&2; exit 1; }

      - name: Gate — concurrent run path
        run: |
          node demo/temen/concurrent_run.mjs \
            vendor/temen/browser/target/wasm32-unknown-unknown/release/temen_browser.wasm \
            codegen/selfhost/build/jacl_compiler.temen \
            runtime/build/jaclrt.temen

  workflow-sync:
    name: Workflow sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The privileged copy of each workflow lives in .github/workflows/,
      # but .github/workflows_src/ is the source of truth (see its
      # README). This guards against the two drifting: if someone edits a
      # source file but forgets to promote it (or vice versa), fail with a
      # pointer to the fix. Only *.yml is compared; README.md is ignored.
      - name: Verify .github/workflows matches workflows_src
        run: |
          status=0
          for src in .github/workflows_src/*.yml; do
            name=$(basename "$src")
            dst=".github/workflows/$name"
            if [ ! -f "$dst" ]; then
              echo "::error file=$src::$dst is missing — promote it from workflows_src/"
              status=1
            elif ! diff -u "$dst" "$src" >/dev/null; then
              echo "::error file=$src::$dst is out of sync with $src"
              diff -u "$dst" "$src" || true
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Workflows in .github/workflows/ have drifted from .github/workflows_src/."
            echo "Re-run the copy documented in .github/workflows_src/README.md and commit."
          fi
          exit $status
