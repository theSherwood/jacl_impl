<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JACL Playground</title>
<style>
:root {
  --bg: #ffffff;
  --bg-surface: #f5f5f7;
  --bg-editor: #fafafa;
  --bg-output: #f0f0f2;
  --text: #1d1d1f;
  --text-dim: #86868b;
  --text-bright: #000000;
  --accent: #0066cc;
  --accent-hover: #0055aa;
  --green: #248a3d;
  --red: #d70015;
  --yellow: #9a6700;
  --orange: #bf5600;
  --border: #d2d2d7;
  --font-mono: "SF Mono", "Menlo", "Consolas", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius: 6px;
}

*, *::before, *::after {
  font-variant-ligatures: none;
  -webkit-font-variant-ligatures: none;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- Header --- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: -0.3px;
}

.header h1 span {
  color: var(--accent);
}

.header-links a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
}
.header-links a:hover { color: var(--accent); }

/* --- Toolbar --- */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.example-picker {
  position: relative;
  flex: 1;
  max-width: 400px;
}

.example-picker input {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-sans);
  outline: none;
}
.example-picker input:focus {
  border-color: var(--accent);
}
.example-picker input::placeholder {
  color: var(--text-dim);
}

.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 4px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 400px;
  overflow-y: auto;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.dropdown.hidden { display: none; }

.dropdown-category {
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--bg);
  position: sticky;
  top: 0;
}

.dropdown-item {
  padding: 5px 10px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dropdown-item:hover,
.dropdown-item.highlighted {
  background: rgba(0, 102, 204, 0.08);
}
.dropdown-item .badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 500;
}
.badge-concurrent {
  background: rgba(154, 103, 0, 0.1);
  color: var(--yellow);
}

.toolbar-spacer { flex: 1; }

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-surface);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover {
  border-color: var(--text-dim);
  background: var(--bg);
}
.btn-primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  font-weight: 600;
}
.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.shortcut-hint {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: 2px;
}

/* --- Main panels --- */
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  flex: 1;
  min-height: 0;
}

.panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* Without min-width:0 the grid item's intrinsic min-content (driven
     by the editor's longest line) prevents the column from honoring
     its 1fr share, so a stray wide line nudges the split. */
  min-width: 0;
}

.panel-label {
  padding: 6px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
  flex-shrink: 0;
}

.panel:first-child {
  border-right: 1px solid var(--border);
}

#editor-host {
  flex: 1;
  min-height: 0;          /* let CM6 fill the flex parent */
  background: var(--bg-editor);
  color: var(--text);
  font-family: var(--font-mono);
  overflow: hidden;
}
#editor-host .cm-editor {
  height: 100%;
  outline: none;
}
#editor-host .cm-editor.cm-focused {
  outline: none;
}
.btn.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

#output {
  flex: 1;
  padding: 12px 16px;
  background: var(--bg-output);
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.6;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

#output .error-line {
  color: var(--red);
}

#output .warning-line {
  color: var(--yellow);
}

#output .placeholder {
  color: var(--text-dim);
  font-style: italic;
}

/* --- Status bar --- */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 16px;
  font-size: 12px;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  background: var(--bg-surface);
  flex-shrink: 0;
}

.status-bar .status-error { color: var(--red); }
.status-bar .status-ok { color: var(--green); }

/* --- Responsive --- */
@media (max-width: 768px) {
  .panels {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .panel:first-child {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .example-picker { max-width: none; }
  .shortcut-hint { display: none; }
}

/* --- Scrollbar --- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div class="header">
  <h1><span>JACL</span> Playground</h1>
  <div class="header-links">
    <a href="https://github.com" target="_blank">GitHub</a>
  </div>
</div>

<div class="toolbar">
  <div class="example-picker">
    <input type="text" id="example-search" placeholder="Search examples..." autocomplete="off" spellcheck="false">
    <div id="example-dropdown" class="dropdown hidden"></div>
  </div>
  <div class="toolbar-spacer"></div>
  <button id="vim-toggle" class="btn" title="Toggle vim keybindings (persisted in localStorage)">Vim: off</button>
  <button id="run-btn" class="btn btn-primary" disabled>Run</button>
  <span class="shortcut-hint">Ctrl+Enter</span>
  <button id="clear-btn" class="btn">Clear</button>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-label">Editor</div>
    <div id="editor-host"></div>
  </div>
  <div class="panel">
    <div class="panel-label">Output</div>
    <pre id="output"><span class="placeholder">Loading WASM module...</span></pre>
  </div>
</div>

<div class="status-bar">
  <span id="status">Loading...</span>
  <span id="status-right"></span>
</div>

<script src="wasm/jacl.js"></script>
<script type="module" src="dist/playground.js"></script>
</body>
</html>
