# Phase 1 runtime test harness. Compiles a C driver (which includes the JACL
# runtime) via svm-llvm and runs it on interp + JIT. `cargo test` here is the
# Phase 1 test runner. Own cargo root; path-deps into the svm submodule (links
# libLLVM — needs llvm-18-dev).
[workspace]

[package]
name = "jacl-runtime-harness"
version = "0.0.0"
edition = "2021"
publish = false

# `rlib` for the bins (jacl_svm, stage_macro, …); `staticlib` for `libjacl_runtime_harness.a`,
# which the native JACL frontend links to stage macros on SVM in-process (`jacl_svm_stage`,
# behind JACL_STAGE_ON_SVM — the Phase 5 embedding). See src/stage_ffi.rs.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
svm-ir     = { path = "../../vendor/svm/crates/svm-ir" }
svm-llvm   = { path = "../../vendor/svm/crates/svm-llvm" }
svm-text   = { path = "../../vendor/svm/crates/svm-text" }
svm-verify = { path = "../../vendor/svm/crates/svm-verify" }
svm-interp = { path = "../../vendor/svm/crates/svm-interp" }
svm-jit    = { path = "../../vendor/svm/crates/svm-jit" }
svm-run    = { path = "../../vendor/svm/crates/svm-run" }
svm-encode = { path = "../../vendor/svm/crates/svm-encode" }
svm-opt      = { path = "../../vendor/svm/crates/svm-opt" }
svm-wasm-jit = { path = "../../vendor/svm/crates/svm-wasm-jit" }
