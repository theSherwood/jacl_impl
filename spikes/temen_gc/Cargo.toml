# Spike-2: conservative, non-moving mark-sweep over a window heap, driven by
# gc.roots. C runtime compiled via temen-llvm, run on interp + JIT. Own cargo root;
# path-deps into the temen submodule (links libLLVM — needs llvm-18-dev).
[workspace]

[package]
name = "jacl-temen-gc-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
temen-ir     = { path = "../../vendor/temen/crates/temen-ir" }
temen-llvm   = { path = "../../vendor/temen/crates/temen-llvm" }
temen-text   = { path = "../../vendor/temen/crates/temen-text" }
temen-verify = { path = "../../vendor/temen/crates/temen-verify" }
temen-interp = { path = "../../vendor/temen/crates/temen-interp" }
temen-jit    = { path = "../../vendor/temen/crates/temen-jit" }
