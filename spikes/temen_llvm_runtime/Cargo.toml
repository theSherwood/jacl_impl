# Spike-1b(a): compile a REAL JACL lib/ collection (rrb_vec.h) through temen-llvm
# (clang -O2 -emit-llvm -> temen_llvm::translate_bc_path) and run it on interp + JIT,
# checked against native cc. Validates the "reuse existing C" thesis.
#
# Own cargo root; path-deps into the temen submodule. temen-llvm links libLLVM (needs
# llvm-18-dev installed), so the first build is heavy.
[workspace]

[package]
name = "jacl-temen-llvm-runtime-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
temen-ir     = { path = "../../vendor/temen/crates/temen-ir" }
temen-llvm   = { path = "../../vendor/temen/crates/temen-llvm" }
temen-text   = { path = "../../vendor/temen/crates/temen-text" }
temen-verify = { path = "../../vendor/temen/crates/temen-verify" }
temen-interp = { path = "../../vendor/temen/crates/temen-interp" }
temen-jit    = { path = "../../vendor/temen/crates/temen-jit" }
